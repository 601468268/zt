<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十二个盒子居中</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .boxes {
      display: grid;
      grid-template-columns: repeat(4, 150px);
      gap: 20px;
    }

    .box {
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      color: #222222;
      background: #ffffff;
      border: 2px solid #222222;
      border-radius: 8px;
      font-size: 32px;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .boxes {
        grid-template-columns: repeat(3, 100px);
        gap: 14px;
      }

      .box {
        width: 100px;
        height: 100px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="boxes" aria-label="十二个盒子">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    <div class="box">10</div>
    <div class="box">11</div>
    <div class="box">12</div>
  </main>
</body>
</html>
