<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>104 张涛</title>
    <style>
       p{
            color:#94a;
            font-size: 50px;
       }
       /* 标签选择器 */
         #box{
                width: 500px;
                height: 300px;
                background-color: #3344aa;
                color: #ffffff;
                font-size: 50px;
         }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS选择器</p>
        <p><span class="n1">张</span>涛</p>  
        <p>CSS属性</p>
    </div>
    <!-- 扩展1：名字的每个字不同的颜色，在同一行 -->
    <p>
        <span style="color: #ff0000;">张</span>
        <span style="color: #00ff00;">涛</span>
    </p>
    <!-- 扩展2：h2黑底白字 -->
    <h2 style="background-color: #000; color: #fff;">扩展2：h2黑底白字</h2>
    <!-- 扩展三：选择器三个字是白色 -->
    <p style="color: #fff; background-color: #000;">扩展三：选择器三个字是白色</p>
</body>
</html>
