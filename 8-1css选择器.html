<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>张涛</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .boxes {
      display: grid;
      grid-template-columns: repeat(4, 150px);
      gap: 20px;
    }

    .box {
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      color: #222222;
      background: #ffffff;
      border: 2px solid #222222;
      border-radius: 8px;
      font-size: 32px;
      font-weight: bold;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:nth-child(even):hover {
      transform: translateY(-10px) scale(1.05) rotate(3deg);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.85);
    }

    .box:nth-child(2):hover {
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5),
        0 0 25px rgba(255, 215, 0, 0.85);
    }

    .box:nth-child(3):hover {
      text-shadow: 100px 0 20px rgba(0, 0, 0, 0.5);
    }

    .box:nth-of-type(4):hover {
      border-radius: 50%;
    }

    .box:nth-of-type(5):hover {
      color: #ffffff;
      background: linear-gradient(
        45deg,
        #ff0000,
        #ff9900,
        #ffff00,
        #00cc00,
        #0088ff,
        #4b0082,
        #ee00ff
      );
    }

    .box:nth-of-type(6):hover {
      color: #ffffff;
      background: radial-gradient(
        circle,
        #4b0082,
        #0088ff,
        #00cc00,
        #ffff00,
        #ff9900,
        #ff0000
      );
    }

    .box:nth-of-type(11) {
      font-size: 16px;
    }

    .box:nth-of-type(11):hover {
      transform: rotate(360deg);
    }
    
    @media (max-width: 520px) {
      .boxes {
        grid-template-columns: repeat(3, 100px);
        gap: 14px;
      }

      .box {
        width: 100px;
        height: 100px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="boxes" aria-label="十二个盒子">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    <div class="box">10</div>
    <div class="box">24001010104张涛</div>
    <div class="box">12</div>
  </main>
</body>
</html>
