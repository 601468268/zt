<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张涛 flex 布局</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 30px;
        }
        .wrap-box{
            display: flex;
            gap: 20px;
        }
        .card{
            width: 300px;
            height: 300px;
            border: 1px solid #999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
        }
        /* 1.单个方块 */
        .box1{
        }
        .box1 .item{
            width: 100px;
            height: 100px;
            border:1px solid #333;
            background:#ddd;
        }

        /* 2.上下两个，中间带间隔 gap */
        .box2{
            flex-direction: column;
            gap:14px;
        }
        .box2 .item{
            width: 140px;
            height: 80px;
            border:1px solid #333;
            background:#ddd;
        }

        /*3.两行两列 2×2布局，不是一列四个*/
        .box3{
            display: flex;
            flex-wrap: wrap;
            gap:14px;
            justify-content: center;
        }
        .box3 .item{
            width: 120px;
            height: 80px;
            border:1px solid #8306d0;
            background:#ddd;
            /* 限定一行放2个 */
            flex:0 0 120px;
        }

        /*4.顶部通栏，下面两个并排*/
        .box4{
            flex-direction: column;
            gap:14px;
        }
        .box4 .top-item{
            width: 100%;
            height: 80px;
            border:1px solid #3b9eef;
            background:#ddd;
        }
        .box4 .bottom-row{
            display:flex;
            gap:14px;
        }
        .box4 .bottom-item{
            width: 120px;
            height: 80px;
            border:1px solid #333;
            background:#ec4f23;
        }
    </style>
</head>
<body>
<h2>张涛 flex</h2>
<div class="wrap-box">
    <!-- 第1个：单个方块 -->
    <div class="card box1">
        <div class="item"></div>
    </div>
    <!-- 第2个：上下2个，中间有间隔 -->
    <div class="card box2">
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <!-- 第3个：2行2列，一行2个，共两行 -->
    <div class="card box3">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <!-- 第4个：上通栏，下两个 -->
    <div class="card box4">
        <div class="top-item"></div>
        <div class="bottom-row">
            <div class="bottom-item"></div>
            <div class="bottom-item"></div>
        </div>
    </div>
</div>
</body>
</html>
